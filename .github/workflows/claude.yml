# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Claude Code
on:
  issue_comment: { types: [created, edited] }
  pull_request_review_comment: { types: [created, edited] }
  issues: { types: [opened, assigned, labeled] }
  pull_request_review: { types: [submitted, edited] }
  workflow_dispatch: { inputs: { prompt: { description: "Prompt for Claude", required: false, type: string } } }
  # Bot dependency-PR review lives in bot-pr-test.yml + bot-pr-review.yml
  # (secure split: untrusted code runs without secrets, privileged step never executes PR code).
  # Do not re-add a pull_request_target bot-review job here.
jobs:
  claude:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.actor == github.repository_owner && (
          (contains(fromJSON('["issue_comment","pull_request_review_comment"]'), github.event_name) && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
          (github.event_name == 'issues' && contains(format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude'))
        )
      )
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
    concurrency: { group: "claude-code-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}", cancel-in-progress: true }
    steps:
      - { uses: actions/checkout@v6, with: { fetch-depth: 0 }, id: checkout }
      - { uses: oven-sh/setup-bun@v2, with: { bun-version: "latest" }, id: bun }
      - { uses: ./.github/actions/install-uv, id: uv }
      - { uses: kjanat/install-dprint@v1, id: dprint }
      - { uses: taiki-e/install-action@just, id: just }
      - { run: "uv sync --all-groups --all-extras", id: uv-sync }
      - name: "@claude"
        uses: anthropics/claude-code-action@v1
        id: claude
        with:
          label_trigger: claude
          assignee_trigger: claude
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          use_sticky_comment: ${{ github.event_name != 'workflow_dispatch' }}
          use_commit_signing: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: "actions: read"
          settings: ${{ vars.CLAUDE_SETTINGS }}
          path_to_bun_executable: "${{ steps.bun.outputs.bun-path }}"
          prompt: ${{ github.event.inputs.prompt || '' }}
          branch_name_template: "{{prefix}}{{label}}-{{entityNumber}}-{{description}}"
          allowed_bots: "coderabbitai[bot],dependabot[bot],renovate[bot]"
